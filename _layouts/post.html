---
layout: default
---
<article class="site-post h-entry zoomable">
<header class="site-post-header"><h1 class="p-name">{{ page.title | escape }}</h1></header>
<div class="trix-content e-content">{{ content }}</div>
<footer class="site-meta">
{% if page.tags.size > 0 %}<div class="site-tags">{% for tag in page.tags %}<a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a> {% endfor %}</div>{% endif %}
<div class="published-at"><time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d/%m/%Y' }}</time></div>
</footer>
{% include email-subscribe.html %}
</article>
