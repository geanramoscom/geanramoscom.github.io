---
layout: page
title: Tags
permalink: /tags/
---
{% assign sorted_tags = site.tags | sort %}
{% for tag in sorted_tags %}
<section id="{{ tag[0] | slugify }}" class="tag-section">
<h2>{{ tag[0] | escape }} ({{ tag[1].size }})</h2>
<ul>{% for post in tag[1] %}<li><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></li>{% endfor %}</ul>
</section>
{% endfor %}
