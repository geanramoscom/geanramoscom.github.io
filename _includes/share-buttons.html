{% assign share_url = page.url | absolute_url %}
{% assign share_title = page.title | default: site.title %}
<section class="post-share" aria-label="Compartilhar este artigo">
  <p class="post-share-label">Gostou do artigo? Compartilhe:</p>
  <div class="post-share-links">
    <a href="https://api.whatsapp.com/send?text={{ share_title | append: ' ' | append: share_url | url_encode }}" target="_blank" rel="noopener noreferrer" aria-label="Compartilhar pelo WhatsApp">WhatsApp</a>
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url | url_encode }}" target="_blank" rel="noopener noreferrer" aria-label="Compartilhar no Facebook">Facebook</a>
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url | url_encode }}" target="_blank" rel="noopener noreferrer" aria-label="Compartilhar no LinkedIn">LinkedIn</a>
    <button class="post-share-copy" type="button" data-share-url="{{ share_url | escape }}">Copiar link</button>
  </div>
  <span class="post-share-feedback" role="status" aria-live="polite"></span>
</section>
<style>
.post-share{margin:2rem 0 1rem;padding:1rem 0;border-top:1px solid currentColor}
.post-share-label{font-weight:600;margin:0 0 .75rem}
.post-share-links{display:flex;flex-wrap:wrap;gap:.6rem}
.post-share-links a,.post-share-links button{display:inline-flex;align-items:center;justify-content:center;padding:.55rem .85rem;border:1px solid currentColor;border-radius:.65rem;color:inherit;background:transparent;font:inherit;font-size:.9rem;line-height:1.3;text-decoration:none;cursor:pointer}
.post-share-links a:hover,.post-share-links button:hover{background:color-mix(in srgb,currentColor 9%,transparent)}
.post-share-links a:focus-visible,.post-share-links button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.post-share-feedback{display:block;min-height:1.2em;margin-top:.3rem;font-size:.8rem}
</style>
<script>
document.addEventListener('click',async function(event){
  var button=event.target.closest('.post-share-copy');
  if(!button)return;
  var feedback=button.closest('.post-share').querySelector('.post-share-feedback');
  try{
    await navigator.clipboard.writeText(button.dataset.shareUrl);
    feedback.textContent='Link copiado!';
  }catch(e){
    feedback.textContent='Não foi possível copiar automaticamente. Copie o endereço da página.';
  }
});
</script>
