{% assign seo_title = page.title | default: site.title %}
{% assign seo_desc = page.description | default: site.description %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% if seo_title != site.title %}{{ seo_title | escape }} | {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ seo_desc | strip_html | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/png" href="{{ '/img/logo.png' | relative_url }}">
<link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="RSS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..900&display=swap" rel="stylesheet">
<script>
(function(){var t;try{t=localStorage.getItem('geanramos-v2-theme')}catch(e){}
if(!['light','dark','brown'].includes(t))t=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t==='light'?'light':'dark';})();
</script>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
